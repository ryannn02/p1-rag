[project]
name = "p1-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pypdf>=4.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/p1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
